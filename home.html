<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mahalaxmi Travels</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        :root {
            --blue: #078bd7;
            --dark: #222;
            --light: #f7f9fc;
        }

        body {
            background: var(--light);
            color: var(--dark);
        }

        /* ================= NAVBAR ================= */

        header {
            width: 100%;
            background: white;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            max-width: 1200px;
            height: 90px;
            margin: auto;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Logo */

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            text-decoration: none;
            color: var(--blue);
            font-size: 22px;
            font-weight: bold;
        }

        .logo-icon {
            width: 60px;
            height: 60px;

            border: 5px solid var(--blue);
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .logo-text span {
            display: block;
        }

        /* Navigation */

        .nav-links {
            display: flex;
            align-items: center;
            gap: 35px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 17px;
        }

        .nav-links a:hover {
            color: var(--blue);
        }


        /* ================= HERO ================= */

        .hero {

            height: 650px;

            margin-top: 90px;

            background:
                linear-gradient(
                    rgba(0,0,0,.15),
                    rgba(0,0,0,.15)
                ),
                url("bus.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
        }

        .hero-content {
            color: white;

            background: rgba(0,0,0,.25);

            padding: 25px 40px;
            border-radius: 10px;
        }

        .hero-content h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .hero-content p {
            font-size: 20px;
        }


        /* ================= BOOKING SEARCH ================= */

        .search-box {

            width: min(90%, 1100px);

            background: white;

            margin: -35px auto 60px;

            position: relative;

            padding: 20px;

            border-radius: 10px;

            box-shadow: 0 5px 25px rgba(0,0,0,.15);

            display: grid;

            grid-template-columns:
                1fr
                40px
                1fr
                1fr
                1fr
                150px;

            gap: 10px;

            align-items: end;
        }


        .search-item label {

            display: block;

            font-size: 13px;

            font-weight: bold;

            color: #666;

            margin-bottom: 6px;
        }


        .search-item input {

            width: 100%;

            height: 45px;

            padding: 10px;

            border: 1px solid #ddd;

            border-radius: 7px;

            font-size: 14px;
        }


        .search-item input:focus {

            outline: none;

            border-color: var(--blue);
        }


        /* Swap Button */

        .swap {

            width: 38px;
            height: 38px;

            border-radius: 50%;

            border: 1px solid #777;

            background: white;

            color: #075bd8;

            font-size: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 3px;
        }


        /* Search Button */

        .search-btn {

            height: 45px;

            background: black;

            color: white;

            border: none;

            border-radius: 0;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        .search-btn:hover {

            background: var(--blue);
        }


        /* ================= PACKAGES TAB ================= */

        .packages-tab {

            position: fixed;

            left: 0;

            top: 45%;

            background: var(--blue);

            color: white;

            padding: 15px 10px;

            writing-mode: vertical-rl;

            border-radius: 0 5px 5px 0;

            z-index: 500;
        }


        /* ================= WHATSAPP ================= */

        .whatsapp {

            position: fixed;

            right: 20px;

            bottom: 20px;

            width: 50px;
            height: 50px;

            background: #20c863;

            color: white;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            z-index: 500;
        }


        /* ================= MOBILE ================= */

        @media(max-width: 900px) {

            .navbar {
                height: auto;
                padding: 15px;

                flex-direction: column;

                gap: 15px;
            }

            .nav-links {
                gap: 15px;

                flex-wrap: wrap;

                justify-content: center;
            }

            .nav-links a {
                font-size: 14px;
            }

            .hero {
                margin-top: 130px;
                height: 450px;
            }

            .hero-content h1 {
                font-size: 35px;
            }

            .search-box {

                grid-template-columns: 1fr;

                width: 90%;

                margin-top: -20px;
            }

            .swap {
                margin: auto;

                transform: rotate(90deg);
            }

            .search-btn {
                width: 100%;
            }
        }

    </style>
</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <nav class="navbar">

        <!-- Logo -->

        <a href="#" class="logo">

            <div class="logo-icon">
                MT
            </div>

            <div class="logo-text">
                <span>NESSUS TOURS</span>
                <span>TRAVELS</span>
            </div>

        </a>


        <!-- Navigation -->

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="bookings.html">Manage Bookings</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

        </ul>

    </nav>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

    <div class="hero-content">

        <h1>Travel With Comfort</h1>

        <p>
            Book your journey with Mahalaxmi Travels
        </p>

    </div>

</section>


<!-- ================= BOOKING SEARCH ================= -->

<form class="search-box">

    <div class="search-item">

        <label for="origin">
            Origin
        </label>

        <input
            type="text"
            id="origin"
            placeholder="Enter origin"
        >

    </div>


    <div class="swap">
        ⇄
    </div>


    <div class="search-item">

        <label for="destination">
            Destination
        </label>

        <input
            type="text"
            id="destination"
            placeholder="Enter destination"
        >

    </div>


    <div class="search-item">

        <label for="date">
            Journey Date
        </label>

        <input
            type="date"
            id="date"
        >

    </div>


    <div class="search-item">

        <label for="return">
            Return
        </label>

        <input
            type="date"
            id="return"
        >

    </div>


    <button class="search-btn" type="submit">

        SEARCH

    </button>

</form>


<!-- ================= PACKAGES ================= -->

<div class="packages-tab">

    📦 Packages

</div>


<!-- ================= WHATSAPP ================= -->

<div class="whatsapp">

    ☎

</div>


</body>
</html>
